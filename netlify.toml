# Netlify configuration for AnalyzeG static site
# Cache headers are the single biggest lever for repeat-visit performance.
# Strategy:
#   - Images/fonts/favicons: 1 year immutable (content doesn't change; same filename = same content)
#   - CSS/JS: 1 week (can be invalidated by filename change if needed)
#   - HTML: 1 hour + revalidate (pages change; must not serve stale)
#   - Manifest/browserconfig: 1 day

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/browserconfig.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"
    Vary = "Accept"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"
    Vary = "Accept"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

# Markdown negotiation: signal AI bots that markdown content is available
[[headers]]
  for = "/*.html"
  [headers.values]
    Vary = "Accept"
    Link = "</llms.txt>; rel=\"alternate\"; type=\"text/plain\""

# Redirects — authority consolidation (subfolder wins)
[[redirects]]
  from = "/earn-money-reviews.html"
  to = "/for-reviewers/"
  status = 301
  force = true

[[redirects]]
  from = "/earn-money-reviews"
  to = "/for-reviewers/"
  status = 301
  force = true

# Pretty URL support for file-format build — serve .html at clean path
[[redirects]]
  from = "/for-reviewers/"
  to = "/for-reviewers.html"
  status = 200
  force = false

[[redirects]]
  from = "/for-reviewers"
  to = "/for-reviewers.html"
  status = 200
  force = false

# Legacy analyzeg.netlify.app references should use app.analyzeg.co.in (via JS resolver, but header as fallback)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index"
